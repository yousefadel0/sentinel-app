[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel — autonomous AI network defense appliance (M0 scaffold & contracts)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]
# M7 (§10-M7): Minimal Ops UI — isolated OPTIONAL module; core stays CLI-only.
# These extras are NOT pulled into the base install; `pip install .[ops-ui]`.
ops-ui = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",   # test client transport for the parity/isolation suites
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: end-to-end evaluation runs (tens of seconds)"]

[tool.coverage.run]
source = ["sentinel"]
branch = true

[tool.coverage.report]
show_missing = true
