name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest moved to 26.04, which has no Python 3.9 build;
        # 24.04 matches the production sensor OS anyway.
        os: [ubuntu-24.04, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,ops-ui]"
      - run: python -m pytest --cov --cov-fail-under=85
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/Dockerfile -t sentinel:ci .
      - run: docker run --rm sentinel:ci --version
